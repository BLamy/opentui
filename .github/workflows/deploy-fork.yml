name: Deploy Fork to GitHub Pages

# A fork's project site lives under /<repo>, without the package index or the release channel of opentui.com. This
# builds the site from this checkout, with /docs and /docs/next both documenting it, and moves it under the base path.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository != 'anomalyco/opentui'
    runs-on: ubuntu-latest
    env:
      OPENTUI_SITE_BASE: /${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      # Live docs examples run core in the page from opentui.wasm and core's browser assets.
      - name: Build browser runtime
        working-directory: packages/core
        run: |
          bun run build:wasm
          bun run build:lib

      - name: Build site
        working-directory: packages/web
        run: |
          bun run build
          bun scripts/site/rebase-site.ts dist "$OPENTUI_SITE_BASE"

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
